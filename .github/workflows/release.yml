name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build universal binary
        shell: bash
        run: |
          # 版本号取自 tag 名（去掉 v 前缀由 build.sh 处理），确保产物版本与 tag 一致
          export PMAP_VERSION="${GITHUB_REF_NAME}"
          echo "构建版本：${PMAP_VERSION}"
          ./build.sh

      - name: Package DMG
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          STAGING="$(mktemp -d)"
          cp -R pmap.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "pmap" -srcfolder "$STAGING" -ov -format UDZO "pmap-${VERSION}.dmg"
          echo "DMG_FILE=pmap-${VERSION}.dmg" >> "$GITHUB_ENV"
          ls -la "pmap-${VERSION}.dmg"

      - name: Create release and upload
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_FILE }}
          generate_release_notes: true
